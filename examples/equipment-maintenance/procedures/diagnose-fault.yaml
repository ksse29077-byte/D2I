id: "diagnose-fault"
version: "1"
steps:
  - id: "normalize-symptom"
    kind: "term-normalizer"
    next: "retrieve-cases"
  - id: "retrieve-cases"
    kind: "case-retriever"
    next: "decide-procedure"
  - id: "decide-procedure"
    kind: "procedure-decider"
    next: "return-result"
  - id: "return-result"
    kind: "return"
