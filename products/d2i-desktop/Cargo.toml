[package]
name = "d2i-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
d2i-action-candidates = { path = "../../crates/d2i-action-candidates" }
d2i-action-selection = { path = "../../crates/d2i-action-selection" }
d2i-application-semantics = { path = "../../crates/d2i-application-semantics" }
