d2i_version: "0.1"
domain:
  id: "phase1-good"
  version: "0.1.0"
  name: "Phase 1 Good Fixture"
  languages: ["en"]
target:
  os: "linux"
  arch: "x86_64"
  network_policy: "deny"
  max_memory_mb: 256
  preferred_device: "cpu"
objectives:
  min_task_success_rate: 0.9
  max_critical_error_rate: 0.01
  target_p95_latency_ms: 50
  deterministic: true
sources:
  - path: "data"
    kind: "knowledge"
    trust: "approved"
skills:
  - id: "answer"
    version: "1"
    input_schema: "schemas/request.schema.json"
    output_schema: "schemas/result.schema.json"
    criticality: "high"
    fallback: "human_review"
    evidence_required: true
evaluation:
  dataset: "eval/gold.jsonl"
  thresholds: "eval/thresholds.yaml"
package:
  signing: "required"
  include_source_data: false
  include_eval_data: true
