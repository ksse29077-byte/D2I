[workspace]
members = ["."]
resolver = "2"

[package]
name = "d2i-example-module"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
d2i-module-sdk = { path = "../../crates/d2i-module-sdk" }
serde = { version = "=1.0.220", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints]
workspace = true
