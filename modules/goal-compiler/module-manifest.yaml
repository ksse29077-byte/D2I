  source_license: Apache-2.0
  artifact_license: Apache-2.0
  datasets: []
  dataset_licenses: {}
  commercial_use: permitted-under-apache-2.0
  attribution:
    - D2I Cognitive Module Platform
  generated_artifact: false
  third_party_dependencies:
