schema_version: 1
identity:
  module_id: goal-compiler
  display_name: Deterministic Goal Compiler
  description: Compiles explicit authenticated Korean instructions into complete Cognitive IR v1 goals or typed clarification outcomes.
  version: 1.0.0
  contract_version: 1
  build_id: goal-compiler-v1
  artifact_filename: artifacts/goal-compiler.ref
  artifact_sha256: sha256:0f2e9c09488c592b3c812297df565dcddcb97da793a06321d72c01929fd06b29
  author: D2I Cognitive Module Platform
  maintainer: D2I Cognitive Module Platform
capabilities:
  - capability_id: cognitive.goal-compile
    capability_version: 1.0.0
    category: goal_compiler
    supported_input_kinds:
      - goal-compilation-input-v1
    supported_output_kinds:
      - goal-compilation-result-v1
    supported_risk_classes:
      - read_only
      - reversible
      - business_state_change
      - high_criticality
    deterministic: true
    side_effect: false
    network_requirement: denied
    streaming: false
    confidence_semantics: not_applicable
    input_schemas:
      - goal-compilation-input-v1
    output_schemas:
      - goal-compilation-result-v1
    unsupported_case_policy: Return outer unsupported only for unsupported locale or deterministic grammar; return typed clarification_required for incomplete or ambiguous supported input.
    fallback_capability: null
    fallback_module: null
schemas:
  - schema_id: goal-compilation-input-v1
    schema_version: 1
    path: schemas/input.schema.json
    sha256: sha256:5e202326ba358a4f1d9f912b6ffa7719ca8507aade62955ef1fb6ade81594b3a
  - schema_id: goal-compilation-result-v1
    schema_version: 1
    path: schemas/output.schema.json
    sha256: sha256:8f118fa36596261871166257c2956a0dc066eea75d0b98fc7f6b6f14677c2a61
execution:
  mode: in_process_rust_reference
  timeout_logical_ticks: 100
  maximum_input_bytes: 1048576
  maximum_output_bytes: 1048576
  memory_limit_bytes: 8388608
  logical_operation_budget: 4096
  maximum_retries: 0
  maximum_concurrent_invocations: 1
  network_requirement: denied
  filesystem_required: false
  environment_variables_allowed: false
  side_effect: false
  reversible: true
security:
  accepted_trust_labels:
    - authenticated_user_instruction
    - fixture
    - observed_ui_state
    - untrusted_web_content
    - untrusted_document_content
  untrusted_content_handling: reject
  secrets_required: false
  raw_secret_input: false
  privileged_operation: false
  allowed_external_dependencies:
    - d2i-module-sdk
  audit_requirement: invocation_and_result
  fail_policy: closed
  data_retention: none
evaluation:
  evaluation_set_id: goal-compiler-conformance
  evaluation_set_version: 1.0.0
  metrics:
    - valid_explicit_extraction_accuracy
    - clarification_recall
    - goal_spec_schema_validity
    - deterministic_replay_rate
    - untrusted_instruction_elevation
    - critical_error_rate
  acceptance_thresholds:
    valid_explicit_extraction_accuracy: 1.0
    clarification_recall: 1.0
    goal_spec_schema_validity: 1.0
    deterministic_replay_rate: 1.0
    untrusted_instruction_elevation: 0.0
    critical_error_rate: 0.0
  critical_error_definition: Invented or invalid GoalSpec content, underestimated risk, untrusted authority, nondeterminism, secret leakage, or side effect.
  known_unsupported_cases:
    - Locale other than ko-KR.
    - Instruction without the approved Korean labeled grammar.
    - Objective operation outside the deterministic risk grammar.
  benchmark_reference: fixtures/valid/read-only.json
  deterministic_replay_required: true
provenance_and_license:
