[workspace]
members = ["."]
resolver = "2"

[package]
name = "d2i-element-grounder"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
d2i-module-sdk = { path = "../../crates/d2i-module-sdk" }
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.138"

[dev-dependencies]
jsonschema = { version = "=0.18.3", default-features = false, features = ["draft202012"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints]
workspace = true
