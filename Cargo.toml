[workspace]
members = [
    "crates/d2i-core",
    "crates/d2i-schema",
    "crates/d2i-eval",
    "crates/d2i-compiler",
    "crates/d2i-runtime-api",
    "crates/d2i-runtime-ref",
    "crates/d2i-runtime-adapter",
    "crates/d2i-ffi",
    "crates/d2i-kernel",
    "crates/d2i-learning",
    "crates/d2i-module-sdk",
    "crates/d2i-cognitive-ir",
    "crates/d2i-application-semantics",
    "crates/d2i-action-candidates",
    "crates/d2i-action-selection",
    "crates/d2i-policy-admission",
    "crates/d2i-trusted-action-execution",
    "crates/d2i-cognitive-recovery",
    "crates/d2i-role-contract",
    "crates/d2i-work-case",
    "crates/d2i-work-intake",
    "crates/d2i-work-queue",
    "crates/d2i-cli",
    "crates/d2i-windows-host",
    "products/d2i-embodied",
    "products/d2i-desktop",
]
exclude = ["modules/*"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
repository = ""

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
csv = "=1.3.1"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "zeroize"] }
jsonschema = { version = "=0.18.3", default-features = false, features = ["draft202012"] }
libloading = "=0.8.9"
planus = "=1.1.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
windows = "=0.62.2"
uiautomation = { version = "=0.25.0", default-features = false, features = ["control", "input", "pattern"] }
